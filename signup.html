<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Vinyl Vibes</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

    <!-- Theme & Layout Toggles for Auth Pages -->
    <div class="position-fixed top-0 end-0 p-4 d-flex align-items-center gap-2" style="z-index: 1050;">
        <button class="theme-toggle-btn border-0 shadow-lg">
            <i class="bi bi-sun-fill"></i>
        </button>
        <a href="#" id="rtlToggle" class="rtl-btn shadow-lg">
            <span id="rtlText" class="fw-bold">RTL</span>
        </a>
    </div>

    <div class="container py-5">
        <div class="row w-100 justify-content-center m-0">
            <div class="col-12 d-flex justify-content-center" style="margin-top: 2rem;" data-aos="fade-up">
                
                <div class="auth-card">
                    <div class="text-center mb-5">
                        <a href="index.html" class="navbar-brand mb-4 d-flex justify-content-center">
                            <i class="bi bi-record-circle-fill"></i>
                            <span>VINYL <span class="accent-text">VIBES</span></span>
                        </a>
                        <h2 class="fw-bold h3 mt-4">Join the Community</h2>
                        <p class="text-white-50 small">Register to track your orders and get early access to record drops.</p>
                    </div>
                    
                    <form>
                        <div class="row g-4">
                            <div class="col-12">
                                <label class="form-label text-white-50 small text-uppercase fw-bold ls-1 mb-1">First Name</label>
                                <div class="input-group bg-dark border border-secondary rounded-pill overflow-hidden">
                                    <span class="input-group-text bg-transparent border-0 text-white-50 ms-2"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control bg-transparent border-0 text-white py-3 shadow-none" placeholder="John" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white-50 small text-uppercase fw-bold ls-1 mb-1">Last Name</label>
                                <div class="input-group bg-dark border border-secondary rounded-pill overflow-hidden">
                                    <span class="input-group-text bg-transparent border-0 text-white-50 ms-2"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control bg-transparent border-0 text-white py-3 shadow-none" placeholder="Doe" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white-50 small text-uppercase fw-bold ls-1 mb-1">Email Address</label>
                                <div class="input-group bg-dark border border-secondary rounded-pill overflow-hidden">
                                    <span class="input-group-text bg-transparent border-0 text-white-50 ms-2"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control bg-transparent border-0 text-white py-3 shadow-none" placeholder="email@address.com" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white-50 small text-uppercase fw-bold ls-1 mb-1">Password</label>
                                <div class="input-group bg-dark border border-secondary rounded-pill overflow-hidden">
                                    <span class="input-group-text bg-transparent border-0 text-white-50 ms-2"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control bg-transparent border-0 text-white py-3 shadow-none" placeholder="••••••••" required>
                                </div>
                                <div class="form-text text-white-50 small mt-2">Must be at least 8 characters long.</div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white-50 small text-uppercase fw-bold ls-1 mb-1">Confirm Password</label>
                                <div class="input-group bg-dark border border-secondary rounded-pill overflow-hidden">
                                    <span class="input-group-text bg-transparent border-0 text-white-50 ms-2"><i class="bi bi-shield-check"></i></span>
                                    <input type="password" class="form-control bg-transparent border-0 text-white py-3 shadow-none" placeholder="••••••••" required>
                                </div>
                                <div class="form-text text-white-50 small mt-2">Must match your chosen password.</div>
                            </div>
                            <div class="col-12">
                                <div class="form-check d-flex align-items-start mb-0">
                                    <input type="checkbox" class="form-check-input bg-dark border-secondary mt-1" id="terms" required>
                                    <label class="form-check-label text-white-50 small ms-2" for="terms">I agree to the <a href="#" class="accent-text text-decoration-none fw-bold">Terms and Privacy Policy</a></label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-warning w-100 rounded-pill py-3 fw-bold mt-2 mb-2">CREATE ACCOUNT</button>
                            </div>
                        </div>
                    </form>

                    <div class="mt-4 pt-2 border-top border-secondary text-center">
                        <p class="text-white-50 small">Fast register with</p>
                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <a href="#" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;"><i class="bi bi-google"></i></a>
                            <a href="#" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;"><i class="bi bi-apple"></i></a>
                            <a href="#" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;"><i class="bi bi-facebook"></i></a>
                        </div>
                        <p class="text-white-50 small mb-0">Already a member? <a href="login.html" class="accent-text fw-bold text-decoration-none">Login Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
