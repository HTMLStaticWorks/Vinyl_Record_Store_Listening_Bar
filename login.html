<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vinyl Vibes</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

    <!-- Theme & Layout Toggles for Auth Pages -->
    <div class="position-fixed top-0 end-0 p-4 d-flex align-items-center gap-2" style="z-index: 1050;">
        <button class="theme-toggle-btn border-0 shadow-lg">
            <i class="bi bi-sun-fill"></i>
        </button>
        <a href="#" id="rtlToggle" class="rtl-btn shadow-lg">
            <span id="rtlText" class="fw-bold">RTL</span>
        </a>
    </div>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-5" data-aos="fade-up">
                <div class="auth-card">
                    <div class="text-center mb-5">
                        <a href="index.html" class="navbar-brand mb-4 d-flex justify-content-center">
                            <i class="bi bi-record-circle-fill"></i>
                            <span>VINYL <span class="accent-text">VIBES</span></span>
                        </a>
                        <h2 class="fw-bold h3 mt-3">Welcome Back</h2>
                        <p class="text-white-50 small">Enter your credentials to access your collection.</p>
                    </div>
                    
                    <form>
                        <div class="mb-4">
                            <label class="form-label text-white-50 small text-uppercase fw-bold ls-1">Email Address</label>
                            <div class="input-group bg-dark border border-secondary rounded-pill overflow-hidden">
                                <span class="input-group-text bg-transparent border-0 text-white-50 ms-2"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-transparent border-0 text-white py-3 shadow-none" placeholder="email@address.com" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-white-50 small text-uppercase fw-bold ls-1">Password</label>
                            <div class="input-group bg-dark border border-secondary rounded-pill overflow-hidden">
                                <span class="input-group-text bg-transparent border-0 text-white-50 ms-2"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-transparent border-0 text-white py-3 shadow-none" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-4 d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <input type="checkbox" class="form-check-input bg-dark border-secondary m-0" id="remember">
                                <label class="form-check-label text-white-50 small ms-2" for="remember">Keep me logged in</label>
                            </div>
                            <a href="#" class="accent-text small text-decoration-none fw-bold">Forgot Password?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-warning w-100 rounded-pill py-3 fw-bold mb-2">LOGIN</button>
                    </form>

                    <div class="mt-4 pt-2 border-top border-secondary text-center">
                        <p class="text-white-50 smaller">Or login with</p>
                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <a href="#" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;"><i class="bi bi-google"></i></a>
                            <a href="#" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;"><i class="bi bi-spotify"></i></a>
                            <a href="#" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;"><i class="bi bi-facebook"></i></a>
                        </div>
                        <p class="text-white-50 small mb-0">Don't have an account? <a href="signup.html" class="accent-text fw-bold text-decoration-none">Sign Up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
